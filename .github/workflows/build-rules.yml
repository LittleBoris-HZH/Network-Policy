name: Build WEPC Rules

on:

  # 修改服务列表后立即更新
  push:
    branches:
      - main

    paths:
      - "policy/services.json"
      - "scripts/build_rules.py"
      - ".github/workflows/build-rules.yml"

  # 每天自动同步 MetaCubeX
  # GitHub cron 使用 UTC
  schedule:
    - cron: "17 3 * * *"

  # 允许手动运行
  workflow_dispatch:


permissions:
  contents: write


# 避免两个构建同时运行
concurrency:
  group: wepc-rule-build
  cancel-in-progress: true


jobs:

  build:

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7

        with:
          python-version: "3.13"

      - name: Build WEPC rules
        run: python scripts/build_rules.py

      - name: Commit generated rules
        shell: bash
        run: |

          git add \
            rules/direct-allow.yaml \
            rules/service-veto.yaml

          # 规则没变化就不产生 commit
          if git diff --cached --quiet; then
            echo "No rule changes."
            exit 0
          fi

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit \
            -m "Update WEPC rules"

          git push
