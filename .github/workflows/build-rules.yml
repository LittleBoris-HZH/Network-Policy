name: Build WEPC Rules

on:

  # 修改服务列表后立即重新生成
  push:
    branches:
      - main

    paths:
      - "policy/services.json"
      - "scripts/build_rules.py"
      - ".github/workflows/build-rules.yml"

  # 每天自动同步一次 MetaCubeX
  # GitHub cron 使用 UTC
  schedule:
    - cron: "17 3 * * *"

  # GitHub Actions 页面可手动运行
  workflow_dispatch:


# 允许 Action 把生成后的规则提交回仓库
permissions:
  contents: write


# 防止两次构建同时运行
concurrency:
  group: wepc-rule-build
  cancel-in-progress: true


jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7

        with:
          python-version: "3.13"

      - name: Build WEPC rules
        run: python scripts/build_rules.py

      - name: Commit generated rules
        shell: bash
        run: |

          git add \
            rules/direct-allow.yaml \
            rules/service-veto.yaml \
            rules/service-ads.yaml

          # 没变化就直接结束，不制造无意义 commit
          if git diff --cached --quiet; then
            echo "No rule changes."
            exit 0
          fi

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit \
            -m "Update WEPC rules"

          git push
